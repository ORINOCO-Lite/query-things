name: Ruff
on: [push, pull_request]
jobs:
  ruff:
    name: Code linting
    runs-on: debian-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install hatch
        run: uv tool install hatch
      - name: Check code
        run: hatch check code && hatch check fmt
