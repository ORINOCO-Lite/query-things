name: Type annotation (project)

on:
  push:
    paths:
      - 'query_things/**.py'
      - '!**/tests/**.py'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install hatch
        run: uv tool install hatch
      - name: Type check project
        run: |
          # get any type stubs that mypy thinks it needs
          hatch run types:mypy --install-types --non-interactive --follow-imports skip query_things
          # run mypy on the full project.
          # run on the oldest supported Python version
          hatch run types:mypy --python-version 3.11 --pretty --show-error-context query_things
